<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Service Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="css/style.css?v=24">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
            // En style.css usamos body.dark-mode pero para que aplique antes que renderice 
            // mejor se lo ponemos temporalmente al documentElement o esperamos al body.
            document.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('dark-mode');
            });
        }
    </script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-main);
            margin: 0;
        }
        .login-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            border-radius: 12px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        .login-container h2 {
            margin-top: 0;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }
        .login-container p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-body);
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary-blue);
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">SD</div>
        <h2>Bienvenido</h2>
        <p>Inicia sesión con tu cuenta corporativa</p>
        
        <form id="login-form">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@safran.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div id="error-msg" class="error-message"></div>
            
            <button type="submit" class="btn-login" id="btn-submit">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;
            const btnSubmit = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');
            
            btnSubmit.innerText = 'Verificando...';
            btnSubmit.disabled = true;
            errorMsg.style.display = 'none';
            
            try {
                // Aquí llamamos al PHP real en la carpeta back
                    const response = await fetch('../back/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, password })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    localStorage.setItem('user_rol', data.rol_id);
                    const rol = parseInt(data.rol_id);
                    if (rol === 2) {
                        window.location.href = 'rh_dashboard.html';
                    } else if (rol === 3) {
                        window.location.href = 'it_dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = 'Error de conexión con el servidor.';
                errorMsg.style.display = 'block';
            }
            
            btnSubmit.innerText = 'Ingresar';
            btnSubmit.disabled = false;
        });
    </script>
</body>
</html>
